<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
</head>
<body style="margin:0">
<title>Tommy Beauty Salon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Great+Vibes&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: the salon's light price-list flyer as UI — near-white ground with soft pink diagonal streaks, white panels in a thin double gold frame, rose serif caps, script accents. Deliberately light-only to match the studio. */
:root{
  color-scheme:light;
  --bg:#FFF9FB; --bg1:#FCE6EE; --streak:rgba(255,255,255,.8);
  --panel:#FFFFFF; --line:#F1DFE6; --gold:#CFAE6B; --gold-soft:#FBF3E2;
  --ink:#3A2930; --muted:#7E666F; --pink:#C2477B; --pink-ink:#FFFFFF; --pink-soft:#FDEEF3;
  --warn:#9A4A10; --off:#FBF4F7; --ki:#F1EAFA; --ki-line:#9A7CC6; --ok:#2E7A55;
  --f-serif:'EB Garamond','Times New Roman',Georgia,serif;
  --f-script:'Great Vibes','Snell Roundhand',cursive;
  --f-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(118deg,transparent 0 18%,var(--streak) 18% 23%,transparent 23% 55%,var(--streak) 55% 61%,transparent 61% 80%,var(--streak) 80% 82%,transparent 82%),
    linear-gradient(160deg,var(--bg1),var(--bg) 45%,var(--bg) 60%,var(--bg1));
  background-attachment:fixed;
  color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
p,h1,h2,h3{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:6px}
.script{font-family:var(--f-script);color:var(--pink);font-weight:400}
.caps{font-family:var(--f-serif);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.page{margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;display:flex;flex-direction:column;gap:18px}
.page.narrow{max-width:520px}
.page.wide{max-width:1180px}

.switch{align-self:center;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap;justify-content:center}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);flex-wrap:wrap;justify-content:center}
.seg a{min-height:34px;display:flex;align-items:center;padding:0 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700}
.seg a[aria-current="page"]{background:var(--pink);color:var(--pink-ink)}

.brand{text-align:center;display:flex;flex-direction:column;align-items:center}
.brand .script{font-size:52px;line-height:1}
.brand .caps{font-size:14px;color:var(--ink);letter-spacing:.22em;margin-top:2px}

.flyer{background:var(--panel);border-radius:3px;padding:24px 22px;box-shadow:inset 0 0 0 1px var(--gold),inset 0 0 0 5px var(--panel),inset 0 0 0 6px rgba(207,174,107,.55),0 20px 40px -32px rgba(160,60,100,.45)}
@media (max-width:420px){.flyer{padding:22px 18px}}
.f-title{font-size:34px;line-height:1.1;margin-bottom:12px}
.progress{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:16px}
.progress span{height:2px;background:var(--line)}
.progress span.on{background:var(--gold)}

.sec{font-size:15px;color:var(--pink);margin:16px 0 2px}
.sec:first-child{margin-top:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:baseline;gap:10px;width:100%;min-height:46px;padding:9px 2px;border:0;border-bottom:1px dotted var(--line);background:transparent;text-align:left;cursor:pointer;font-family:var(--f-serif);font-size:19px;line-height:1.25}
.list li:last-child .row{border-bottom:0}
.row:hover .r-name{color:var(--pink)}
.r-name{flex:1;min-width:0}
.r-price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

.chosen{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:14px;background:var(--pink-soft);border-radius:3px}
.chosen .c-main{flex:1;min-width:0;font-family:var(--f-serif);font-size:18px;font-weight:600;line-height:1.25}
.chosen .c-sub{display:block;font-family:var(--f-ui);font-weight:500;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.chg{border:0;background:transparent;color:var(--pink);font-weight:700;font-size:14px;min-height:40px;padding:0 4px;cursor:pointer}

.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -4px 14px;padding:2px 4px 4px;scrollbar-width:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.days{display:flex;gap:6px;overflow-x:auto;margin:0 -4px 14px;padding:2px 4px 4px;scrollbar-width:none}
.day{flex:0 0 auto;width:54px;min-height:64px;border:1px solid var(--line);border-radius:3px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-variant-numeric:tabular-nums}
.day .wd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .num{font-family:var(--f-serif);font-size:22px;font-weight:600;line-height:1.1}
.day[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--pink-ink)}
.day[aria-pressed="true"] .wd{color:var(--pink-ink)}
.day:disabled{opacity:.35;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:360px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}}
.slot{min-height:44px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.slot:hover{border-color:var(--pink);background:var(--pink-soft)}
.slot[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:var(--pink-ink)}
.empty{text-align:center;padding:16px 8px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{min-height:50px;padding:0 14px;border-radius:3px;border:1px solid var(--line);background:var(--off);color:var(--ink);font-size:16px;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--pink);outline-offset:0;border-color:var(--pink)}
.err{font-size:13px;color:var(--warn);font-weight:600}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:6px 0 16px}
.consent input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--pink)}
.consent a{color:var(--pink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border:1px solid var(--pink);border-radius:999px;background:var(--pink);color:var(--pink-ink);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn.full{width:100%;min-height:54px}
.btn-line{background:var(--panel);color:var(--ink);border-color:var(--ink)}
.link{border:0;background:transparent;color:var(--pink);font-weight:700;min-height:40px;cursor:pointer}
.cal{display:flex;flex-direction:column;gap:8px;width:100%}
.hint-proto{font-size:12px;color:var(--muted)}

.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.done .script{font-size:46px;line-height:1.1}
.done .when{font-family:var(--f-serif);font-size:21px;font-weight:600}
.done .chosen{width:100%;text-align:left}

.foot{text-align:center;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.foot a{color:var(--muted)}

/* ---------- Team ---------- */
.t-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.t-brand{display:flex;align-items:baseline;gap:10px}
.t-brand .script{font-size:40px;line-height:1}
.t-brand .caps{font-size:13px;letter-spacing:.2em}
.t-actions{display:flex;flex-wrap:wrap;gap:8px}
.t-day{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.t-day h2{font-family:var(--f-serif);font-size:26px;font-weight:600;line-height:1.1;flex:1 1 220px;min-width:0}
.t-day .cnt{display:block;font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:2px;border:1px solid}
.sw.on{background:var(--pink-soft);border-color:var(--pink)}
.sw.ph{background:var(--gold-soft);border-color:var(--gold)}
.sw.ki{background:var(--ki);border-color:var(--ki-line)}
.sw.wi{background:var(--panel);border-color:var(--ink);border-style:dashed}
.sw.bl{background:repeating-linear-gradient(135deg,var(--off) 0 4px,var(--line) 4px 6px);border-color:var(--line)}

.notes{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:3px;background:var(--ki);border:1px solid var(--ki-line)}
.note .n-main{flex:1;min-width:0}
.note .n-t{font-weight:700}
.note .n-s{font-size:13px;color:var(--muted)}

.tl-scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
.tl{display:grid;min-width:max-content}
.tl-head{position:sticky;top:0;z-index:2;background:var(--panel);padding:8px 8px 10px;border-bottom:1px solid var(--gold);text-align:center;font-family:var(--f-serif);font-size:18px;font-weight:600}
.tl-head small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted);font-weight:600}
.tl-times{position:relative;border-right:1px solid var(--line)}
.tl-times span{position:absolute;right:8px;transform:translateY(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.tl-col{position:relative;border-right:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour))}
.tl-col:last-child{border-right:0}
.offh{position:absolute;left:0;right:0;background:var(--off)}
.blk{position:absolute;left:4px;right:4px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--off) 0 6px,var(--line) 6px 8px);font-size:12px;font-weight:700;color:var(--muted);padding:4px 8px;overflow:hidden;border:0;text-align:left;cursor:pointer}
.ap{position:absolute;left:4px;right:4px;border-radius:3px;border:1px solid;padding:4px 8px;text-align:left;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;line-height:1.25}
.ap.online{background:var(--pink-soft);border-color:var(--pink)}
.ap.telefon{background:var(--gold-soft);border-color:var(--gold)}
.ap.ki{background:var(--ki);border-color:var(--ki-line)}
.ap.walkin{background:var(--panel);border-color:var(--ink);border-style:dashed}
.ap.noshow{opacity:.5;text-decoration:line-through}
.ap.isnew{box-shadow:0 0 0 3px var(--pink)}
.ap .a-t{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.ap .a-n{font-family:var(--f-serif);font-size:16px;font-weight:600}
.ap .a-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--pink);z-index:1}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--pink)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(58,41,48,.35);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{width:100%;max-width:480px;max-height:calc(100% - 8px);overflow-y:auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-head .script{font-size:36px;line-height:1.1}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px;font-variant-numeric:tabular-nums}
.kv dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0;font-weight:600}
.row2{display:flex;flex-wrap:wrap;gap:8px}
.row2 > *{flex:1 1 140px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:3px;background:var(--panel);text-align:left;cursor:pointer}
.opt:hover{border-color:var(--pink);background:var(--pink-soft)}
.opt .o-main{flex:1;min-width:0;font-family:var(--f-serif);font-size:19px;font-weight:600;line-height:1.2}
.opt .o-sub{display:block;font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--muted)}
.opt .o-go{font-weight:700;color:var(--pink);font-size:14px;white-space:nowrap}
.wi-list .row{font-size:17px;min-height:44px;padding:7px 2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));z-index:30;background:var(--ink);color:var(--panel);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* ---------- Telefon-Assistentin ---------- */
.ph-grid{display:grid;gap:18px;align-items:start}
@media (min-width:900px){.ph-grid{grid-template-columns:400px minmax(0,1fr)}}
.ph-card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ph-card .script{font-size:40px;line-height:1}
.ph-sub{font-size:13px;color:var(--muted);font-weight:600}
.orb{position:relative;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFFFF,var(--pink-soft) 55%,#F7D3E0);box-shadow:inset 0 0 0 1px var(--gold);display:flex;align-items:center;justify-content:center;margin:6px 0}
.orb::before,.orb::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--pink);opacity:0}
.orb.speaking::before{animation:ring 1.6s ease-out infinite}
.orb.speaking::after{animation:ring 1.6s ease-out .8s infinite}
.orb.listening{box-shadow:inset 0 0 0 1px var(--gold),0 0 0 6px var(--gold-soft)}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.orb .o-ic{color:var(--pink)}
.ph-status{font-family:var(--f-serif);font-size:21px;font-weight:600;min-height:1.4em}
.callbtn{width:76px;height:76px;border-radius:50%;border:0;background:var(--pink);color:var(--pink-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 24px -12px rgba(194,71,123,.8)}
.callbtn.end{background:var(--ink)}
.callbtn:disabled{opacity:.5;cursor:wait}
.ph-err{font-size:14px;color:var(--warn);font-weight:600;max-width:32em}
.chat{width:100%;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;text-align:left;padding:4px 2px}
.bub{max-width:88%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45}
.bub.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.user{align-self:flex-end;background:var(--pink-soft);border-bottom-right-radius:4px}
.bub .who{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.log-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.log-head h2{font-family:var(--f-serif);font-size:26px;font-weight:600}
.log{display:flex;flex-direction:column;gap:10px}
.ev{display:flex;gap:12px;padding:12px 14px;border-radius:3px;border:1px solid var(--line);background:var(--panel)}
.ev .e-ic{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--off);color:var(--muted)}
.ev.search .e-ic{background:var(--gold-soft);color:#8A6A22}
.ev.book{border-color:var(--ki-line);background:var(--ki)}
.ev.book .e-ic{background:var(--ki-line);color:#FFFFFF}
.ev.note .e-ic{background:var(--pink-soft);color:var(--pink)}
.ev .e-main{flex:1;min-width:0}
.ev .e-t{font-weight:700;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.ev .e-time{font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ev .e-d{font-size:14px;color:var(--muted)}
.ev .e-slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ev .e-slots span{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--off);font-variant-numeric:tabular-nums}
.ev .e-slots span.yes{background:#E3F2EA;color:var(--ok)}
.ev .e-slots span.no{background:#F8E7DC;color:var(--warn);text-decoration:line-through}
.ev a{color:var(--pink);font-weight:700}
.tries{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.tries p{font-family:var(--f-serif);font-size:17px;font-style:italic;color:var(--ink)}
.ph-empty{padding:18px;border:1px dashed var(--line);border-radius:3px;color:var(--muted);text-align:center}
.live-pill{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 12px));z-index:25;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--ink);color:var(--panel);font-weight:700;font-size:14px;box-shadow:0 12px 30px -14px rgba(0,0,0,.5)}
.live-pill .dot{width:9px;height:9px;border-radius:50%;background:#7FD8A6}
.live-pill button{min-height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--pink);color:var(--pink-ink);font-weight:700;cursor:pointer}
.live-pill a{color:var(--panel)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.orb.speaking::before,.orb.speaking::after{animation:none;opacity:.4}}
</style>

<div id="app"></div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="live-pill" id="livepill" hidden><span class="dot" aria-hidden="true"></span><a href="#telefon">Anruf läuft</a><button type="button" data-a="ph-hangup">Auflegen</button></div>

<script src="https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.30.0/dist/lib.iife.js"></script>

  let seed = 11; const rand = () => (seed = (seed*9301+49297) % 233280) / 233280;

  // =============== KERNLOGIK: frei = Arbeitszeit − Termine − Blocker ===============
  function busyFor(staffId, ds){

  function freeSlots(ds, svc, pref, lead){
    const wd = fromIso(ds).getDay(), now = new Date();

    STAFF.filter(s => pref === 'any' || s.id === pref).forEach(s => {
      const h = s.hours[wd]; if (!h) return;
      const open = toMin(h[0]), close = toMin(h[1]), busy = busyFor(s.id, ds);

        if (!found.has(t)) found.set(t, s.id);

      'UID:' + calStamp(ds,start) + '-' + Math.random().toString(36).slice(2) + '@tommy-beauty',

  // =============== TELEFON-ASSISTENTIN: Werkzeuge, die die KI aufruft ===============
  function resolveStaff(v){
    const x = String(v || '').trim().toLowerCase();
    if (!x || x === 'egal' || x === 'any') return 'any';
    const s = STAFF.find(s => s.id === x || s.name.toLowerCase() === x);
    return s ? s.id : null;
  }
  function resolveService(v){
    const x = String(v || '').trim();
    return svcById(x) || SERVICES.find(s => (s.catLabel + ' ' + s.name).toLowerCase() === x.toLowerCase()) || null;
  }
  const svcLabel = s => s.catLabel + ' – ' + s.name;
  const dayText = ds => { const i = Math.round((fromIso(ds) - today) / 864e5); const base = fmtLong.format(fromIso(ds)); return i === 0 ? 'heute, ' + base : i === 1 ? 'morgen, ' + base : base; };
  const slotOut = s => ({uhrzeit: hhmm(s.t), mitarbeiterin_id: s.staffId, mitarbeiterin: staffById(s.staffId).name});

  function toolSearch(p){
    const svc = resolveService(p.leistung); if (!svc) return {fehler:'Unbekannte Leistung. Bitte eine ID aus der Leistungsliste verwenden.'};
    const pref = resolveStaff(p.mitarbeiterin); if (!pref) return {fehler:'Diese Mitarbeiterin gibt es nicht. Team: ' + STAFF.map(s => s.name).join(', ')};
    if (!/^\d{4}-\d{2}-\d{2}$/.test(p.datum || '')) return {fehler:'Datum bitte als JJJJ-MM-TT.'};
    const ds = p.datum, offset = Math.round((fromIso(ds) - today) / 864e5);
    if (offset < 0) return {fehler:'Dieser Tag liegt in der Vergangenheit.'};
    if (offset > MAX_AHEAD) return {fehler:'Termine gibt es nur bis 8 Wochen im Voraus.'};
    const wish = /^\d{1,2}:\d{2}$/.test(p.uhrzeit || '') ? toMin(p.uhrzeit) : null;
    const slots = freeSlots(ds, svc, pref);
    const out = {leistung: svcLabel(svc) + ' (' + svc.price + ' Euro, ca. ' + svc.duration + ' Minuten)', tag: dayText(ds), datum: ds,
      mitarbeiterin_wunsch: pref === 'any' ? 'egal' : staffById(pref).name,
      studio_geoeffnet: STAFF.some(s => s.hours[fromIso(ds).getDay()]) };
    if (pref !== 'any' && !staffById(pref).hours[fromIso(ds).getDay()]) out.hinweis = staffById(pref).name + ' arbeitet an diesem Tag nicht.';
    if (wish != null) {
      out.wunschzeit = hhmm(wish);
      const hit = slots.find(s => s.t === wish);
      out.wunschzeit_frei = !!hit;
      if (hit) out.wunschzeit_bei = slotOut(hit);
    }
    const near = wish != null ? slots.slice().sort((a,b) => Math.abs(a.t-wish) - Math.abs(b.t-wish)).filter(s => s.t !== wish).slice(0,4).sort((a,b) => a.t-b.t) : slots.slice(0,4);
    out.freie_zeiten_am_tag = near.map(slotOut);
    if (pref !== 'any' && wish != null && !out.wunschzeit_frei) {
      out.kolleginnen_zur_wunschzeit = STAFF.filter(s => s.id !== pref && freeSlots(ds, svc, s.id).some(x => x.t === wish)).map(s => ({id:s.id, name:s.name}));
    }
    if (!out.wunschzeit_frei && slots.length < 3) {
      const next = [];
      for (let i = offset + 1; i <= MAX_AHEAD && next.length < 2; i++) {
        const d2 = iso(addDays(today,i)), sl = freeSlots(d2, svc, pref);
        if (!sl.length) continue;
        const pick = wish != null ? sl.slice().sort((a,b) => Math.abs(a.t-wish) - Math.abs(b.t-wish)).slice(0,3).sort((a,b) => a.t-b.t) : sl.slice(0,3);
        next.push({datum:d2, tag:dayText(d2), zeiten:pick.map(slotOut)});
      }
      out.naechste_freie_tage = next;
    }
    logEvent('search', {svc, pref, ds, wish, out});
    return out;
  }

  function toolBook(p){
    const svc = resolveService(p.leistung); if (!svc) return {gebucht:false, grund:'Unbekannte Leistung.'};
    const pref = resolveStaff(p.mitarbeiterin); if (!pref) return {gebucht:false, grund:'Unbekannte Mitarbeiterin.'};
    if (!/^\d{4}-\d{2}-\d{2}$/.test(p.datum || '') || !/^\d{1,2}:\d{2}$/.test(p.uhrzeit || '')) return {gebucht:false, grund:'Datum oder Uhrzeit fehlt.'};
    if (!String(p.name || '').trim()) return {gebucht:false, grund:'Name fehlt.'};
    const t = toMin(p.uhrzeit), hit = freeSlots(p.datum, svc, pref).find(s => s.t === t);
    if (!hit) {
      const alt = toolSearch({leistung:svc.id, mitarbeiterin:p.mitarbeiterin, datum:p.datum, uhrzeit:p.uhrzeit});
      return {gebucht:false, grund:'Diese Zeit ist inzwischen vergeben.', alternativen:alt};
    }
    const id = newId(), nr = 'TB-' + Math.random().toString(36).slice(2,6).toUpperCase();
    APPTS.push({id, staffId:hit.staffId, date:p.datum, start:t, end:t + svc.duration, svcId:svc.id, name:String(p.name).trim(), phone:String(p.telefon || '').trim(), source:'ki', status:'ok'});
    S.t.newId = id; S.t.date = p.datum;
    const staff = staffById(hit.staffId);
    const res = {gebucht:true, termin_nr:nr, bestaetigung: svcLabel(svc) + ', ' + dayText(p.datum) + ' um ' + hhmm(t) + ' Uhr bei ' + staff.name, preis: svc.price + ' Euro'};
    logEvent('book', {svc, ds:p.datum, t, staff, name:String(p.name).trim(), nr});
    if (S.view === 'team') render();
    return res;
  }

  function toolNote(p){
    const n = {id:newId(), name:String(p.name || 'Unbekannt').trim(), telefon:String(p.telefon || '–').trim(), anliegen:String(p.anliegen || '').trim(), time:nowClock(), done:false};
    NOTES.unshift(n);
    logEvent('note', n);
    if (S.view === 'team') render();
    return {ok:true, hinweis:'Die Nachricht liegt jetzt in der Team-App. Das Studio meldet sich.'};
  }

  function logEvent(kind, d){
    const e = {kind, time:nowClock()};
    if (kind === 'search') {
      e.title = 'Freie Zeiten geprüft';
      e.detail = svcLabel(d.svc) + ' · ' + fmtShort(fromIso(d.ds)) + ' · ' + (d.pref === 'any' ? 'egal wer' : 'bei ' + staffById(d.pref).name) + (d.wish != null ? ' · Wunsch ' + hhmm(d.wish) : '');
      e.slots = [];
      if (d.wish != null) e.slots.push({t: hhmm(d.wish) + (d.out.wunschzeit_frei ? ' frei' : ' belegt'), cls: d.out.wunschzeit_frei ? 'yes' : 'no'});
      d.out.freie_zeiten_am_tag.forEach(s => e.slots.push({t: s.uhrzeit + ' ' + s.mitarbeiterin, cls:''}));
      (d.out.kolleginnen_zur_wunschzeit || []).forEach(s => e.slots.push({t: hhmm(d.wish) + ' ' + s.name, cls:'yes'}));
      (d.out.naechste_freie_tage || []).forEach(x => e.slots.push({t: fmtShort(fromIso(x.datum)) + ' ' + x.zeiten.map(z => z.uhrzeit).join(', '), cls:''}));
      if (!e.slots.length) e.slots.push({t:'nichts frei', cls:'no'});
    }
    if (kind === 'book') {
      e.title = 'Termin eingetragen';
      e.detail = d.name + ' · ' + svcLabel(d.svc) + ' · ' + fmtShort(fromIso(d.ds)) + ' ' + hhmm(d.t) + ' Uhr bei ' + d.staff.name;
      e.link = true;
      toast('Neuer Termin von der Telefon-Assistentin: ' + fmtShort(fromIso(d.ds)) + ' ' + hhmm(d.t) + ' Uhr');
    }
    if (kind === 'note') {
      e.title = 'Rückrufbitte ans Team';
      e.detail = d.name + ' · ' + d.telefon + ' · ' + d.anliegen;
    }
    S.call.log.unshift(e);
    if (S.view === 'telefon') renderLog();
  }

  function dynamicVars(){
    const n = new Date();
    const hoursText = s => { const parts = []; [1,2,3,4,5,6].forEach(w => { if (s.hours[w]) parts.push(WD[w] + ' ' + s.hours[w][0] + '–' + s.hours[w][1]); }); return parts.join(', '); };
    return {
      heute_text: fmtYear.format(n), heute_iso: iso(n), uhrzeit_jetzt: pad(n.getHours()) + ':' + pad(n.getMinutes()),
      leistungen: SERVICES.map(s => s.id + ': ' + s.catLabel + ' – ' + s.name + ' – ' + s.price + ' Euro – ca. ' + s.duration + ' Min.').join('\n'),
      team: STAFF.map(s => s.id + ': ' + s.name + ' (' + s.role + ') – ' + hoursText(s)).join('\n'),
      oeffnungszeiten: OPENING
    };
  }

  // ---------- Zugangscode (schützt dein ElevenLabs-Guthaben) ----------
  const CODE_HASH = '1b87490afce5809dc3d6114693c6143b36e0047bb9e2dc51ebd21fd4d244e231';
  let unlocked = false;
  try { unlocked = sessionStorage.getItem('tb-unlocked') === '1'; } catch (e) {}
  async function sha256(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  async function tryUnlock(code){
    let ok = false;
    try { ok = (await sha256(code.trim().toLowerCase())) === CODE_HASH; } catch (e) {}
    S.call.error = ok ? '' : 'Der Code stimmt nicht.';
    if (ok) { unlocked = true; try { sessionStorage.setItem('tb-unlocked','1'); } catch (e) {} }
    renderPhoneTop();
  }

  // ---------- Anruf starten / beenden ----------
  let conversation = null;
  const parse = r => { try { return typeof r === 'string' ? JSON.parse(r) : r || {}; } catch (e) { return {}; } };
  const wrap = fn => async params => JSON.stringify(fn(parse(params)));
  async function startCall(){
    const c = S.call;
    c.error = ''; c.status = 'connecting'; c.chat = []; renderPhoneTop();
    try {
      if (!window.ElevenLabsClient || !navigator.mediaDevices) throw new Error('blocked');
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(t => t.stop());
      conversation = await window.ElevenLabsClient.Conversation.startSession({
        agentId: AGENT_ID,
        dynamicVariables: dynamicVars(),
        clientTools: { freie_termine_suchen: wrap(toolSearch), termin_buchen: wrap(toolBook), nachricht_ans_team: wrap(toolNote) },
        onConnect: () => { c.status = 'live'; renderPhoneTop(); },
        onDisconnect: () => { conversation = null; c.status = 'ended'; c.mode = null; renderPhoneTop(); },
        onModeChange: ({mode}) => { c.mode = mode; updateOrb(); },
        onMessage: m => { const text = String(m.message || '').replace(/\[[^\]]{1,30}\]\s*/g, '').trim(); if (!text) return; c.chat.push({who: (m.role === 'agent' || m.source === 'ai') ? 'ai' : 'user', text}); renderChat(); },
        onError: msg => { c.error = 'Verbindungsfehler: ' + msg; renderPhoneTop(); }
      });
    } catch (e) {
      conversation = null; c.status = 'idle';
      c.error = (e && e.name === 'NotAllowedError') ? 'Bitte erlaube den Zugriff aufs Mikrofon und starte den Anruf erneut.'
        : 'Hier kann der Anruf nicht starten, weil diese Vorschau Mikrofon und Verbindung blockiert. Öffne die HTML-Datei auf deinem Laptop in Chrome, dann funktioniert es.';
      renderPhoneTop();
    }
  }
  async function endCall(){ if (conversation) { try { await conversation.endSession(); } catch (e) {} } conversation = null; S.call.status = 'ended'; S.call.mode = null; renderPhoneTop(); }

  function renderPhoneTop(){
    const el = document.getElementById('ph-top');
    pill.hidden = !(conversation && S.view !== 'telefon');
    if (!el) return;
    const c = S.call, live = c.status === 'live', busy = c.status === 'connecting';
    if (!unlocked) {
      el.innerHTML = '<form id="ph-unlock" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:300px;margin:0 auto">' +
        '<div class="orb"><span class="o-ic">'+PHONE_IC+'</span></div>' +
        '<div class="field" style="width:100%;margin:0"><label for="ph-code">Zugangscode</label><input id="ph-code" type="password" autocomplete="off" inputmode="text"></div>' +
        (c.error ? '<p class="ph-err">'+esc(c.error)+'</p>' : '') +
        '<button type="submit" class="btn full">Freischalten</button><p class="ph-sub">Die Demo ist nur mit Code nutzbar.</p></form>';
      return;
    }
    const status =busy ? 'Verbinde …' : live ? (c.mode === 'speaking' ? 'Assistentin spricht' : 'Hört zu …') : c.status === 'ended' ? 'Anruf beendet' : 'Bereit';
    el.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:12px">' +
      '<div class="orb" id="orb"><span class="o-ic">'+PHONE_IC+'</span></div>' +
      '<p class="ph-status" id="ph-status">'+status+'</p>' +
      (live || busy ? '<button type="button" class="callbtn end" data-a="ph-hangup" aria-label="Auflegen"'+(busy?' disabled':'')+'>'+END_IC+'</button>'
                    : '<button type="button" class="callbtn" data-a="ph-call" aria-label="Studio anrufen">'+PHONE_IC+'</button>') +
      '<p class="ph-sub">'+(live ? 'Sprich ganz normal, wie am Telefon.' : 'Tippe, um das Studio anzurufen.')+'</p>' +
      (c.error ? '<p class="ph-err">'+esc(c.error)+'</p>' : '') + '</div>';
    updateOrb();
  }
  function updateOrb(){
    const o = document.getElementById('orb'), st = document.getElementById('ph-status'), c = S.call;
    if (o) { o.classList.toggle('speaking', c.status === 'live' && c.mode === 'speaking'); o.classList.toggle('listening', c.status === 'live' && c.mode === 'listening'); }
    if (st && c.status === 'live') st.textContent = c.mode === 'speaking' ? 'Assistentin spricht' : 'Hört zu …';
  }
  function renderChat(){
    const el = document.getElementById('chat'); if (!el) return;
    el.innerHTML = S.call.chat.map(m => '<div class="bub '+m.who+'"><span class="who">'+(m.who === 'ai' ? 'Assistentin' : 'Anruferin')+'</span>'+esc(m.text)+'</div>').join('');
    el.scrollTop = el.scrollHeight;
  }
  function renderLog(){
    const el = document.getElementById('log'); if (!el) return;
    const ic = {search:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
      book:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
      note:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>'};
    el.innerHTML = S.call.log.length ? S.call.log.map(e => '<div class="ev '+e.kind+'"><span class="e-ic">'+ic[e.kind]+'</span><div class="e-main"><p class="e-t">'+e.title+'<span class="e-time">'+e.time+' Uhr</span></p><p class="e-d">'+esc(e.detail)+'</p>' +
      (e.slots ? '<div class="e-slots">' + e.slots.map(s => '<span class="'+s.cls+'">'+esc(s.t)+'</span>').join('') + '</div>' : '') +
      (e.link ? '<p style="margin-top:6px"><a href="#team">Im Team-Plan ansehen</a></p>' : '') + '</div></div>').join('')
      : '<p class="ph-empty">Sobald die Assistentin im Kalender nachschaut oder einen Termin einträgt, siehst du es hier live.</p>';
  }

  function render(){
    if (S.view === 'team') { renderTeam(); renderSheet(); }
    else { overlay.hidden = true; S.view === 'telefon' ? renderTelefon() : renderKunde(); }
    pill.hidden = !(conversation && S.view !== 'telefon');
  }
  function route(){ const hsh = location.hash; S.view = hsh === '#team' ? 'team' : (hsh === '#telefon' ? 'telefon' : 'kunde'); render(); window.scrollTo(0,0); }

  // =============== INTERAKTION ===============
  document.addEventListener('click', ev => {
    if (ev.target === overlay) { S.t.sheet = null; S.t.confirmCancel = false; renderSheet(); return; }
    const el = ev.target.closest('[data-a]'); if (!el) return;
    const a = el.dataset.a, c = S.c, t = S.t, p = t.ph;
    switch (a) {
      case 'ph-call': startCall(); return;
      case 'ph-hangup': endCall(); return;
      case 'c-svc': c.svc = svcById(el.dataset.id); c.date = firstFreeDay(c.svc, c.pref); c.step = 2; break;
      case 'c-pref': c.pref = el.dataset.id; if (!freeSlots(c.date, c.svc, c.pref).length) c.date = firstFreeDay(c.svc, c.pref); break;
      case 'c-day': c.date = el.dataset.date; break;
      case 'c-time': c.time = +el.dataset.t; c.staffId = el.dataset.staff; c.step = 3; break;
      case 'c-to1': c.errors = {}; c.step = 1; break;
      case 'c-to2': c.errors = {}; c.step = 2; break;
      case 'c-ics': downloadIcs(c.date, c.time, c.svc); return;
      case 'c-reset': Object.assign(c, {step:1, svc:null, pref:'any', date:null, time:null, staffId:null, name:'', phone:'', consent:false, errors:{}}); break;
      case 't-prev': t.date = iso(addDays(fromIso(t.date), -1)); break;
      case 't-next': t.date = iso(addDays(fromIso(t.date), 1)); break;
      case 't-today': t.date = iso(today); break;
      case 't-note-done': { const n = NOTES.find(x => x.id === el.dataset.id); if (n) n.done = true; break; }
      case 't-open-ph': Object.assign(p, {pref:'any', date: t.date < iso(today) ? iso(today) : t.date, time:null, staffId:null, name:'', phone:'', errors:{}, waReady:false}); t.sheet = 'ph'; break;
      case 't-open-bl': Object.assign(t.bl, {date:t.date}); t.sheet = 'bl'; break;
      case 't-open-ap': t.sel = el.dataset.id; t.confirmCancel = false; t.sheet = 'ap'; break;
      case 't-open-blk': t.sel = el.dataset.id; t.sheet = 'blk'; break;
      case 't-close': t.sheet = null; t.confirmCancel = false; break;
      case 't-open-wi': t.wi = {svcId:null, name:''}; t.sheet = 'wi'; break;
      case 'wi-svc': t.wi.svcId = el.dataset.id; break;
      case 'wi-back': t.wi.svcId = null; break;
      case 'wi-staff': case 'wi-slot': {
        const svc = svcById(t.wi.svcId);
        let staffId, start;
        if (a === 'wi-staff') { const f = freeNowFor(staffById(el.dataset.id), svc); if (!f) { toast('Gerade nicht mehr frei'); break; } staffId = el.dataset.id; start = f.t; }
        else { staffId = el.dataset.staff; start = +el.dataset.t; if (!freeSlots(iso(today), svc, staffId, 0).some(s => s.t === start)) { toast('Diese Zeit ist gerade weg'); break; } }
        const id = newId();
        APPTS.push({id, staffId, date:iso(today), start, end:start + svc.duration, svcId:svc.id, name:t.wi.name.trim() || 'Laufkundschaft', phone:'', source:'walkin', status:'ok'});
        t.newId = id; t.date = iso(today); t.sheet = null;
        toast((a === 'wi-staff' ? 'Läuft · ' : 'Eingetragen für ' + hhmm(start) + ' · ') + staffById(staffId).name + ' · online geblockt');
        break; }
      case 't-ph-pref': p.pref = el.dataset.id; p.time = null; break;
      case 't-ph-day': p.date = el.dataset.date; p.time = null; break;
      case 't-ph-time': p.time = +el.dataset.t; p.staffId = el.dataset.staff; p.errors.time = null; break;
      case 't-ph-save': {
        const e = {};
        if (p.time == null) e.time = 'Bitte eine Uhrzeit wählen.';
        if (p.name.trim().length < 2) e.name = 'Name fehlt.';
        p.errors = e; if (Object.keys(e).length) break;
        const svc = svcById(p.svcId);
        if (!freeSlots(p.date, svc, p.staffId).some(s => s.t === p.time)) { p.time = null; p.errors = {time:'Diese Zeit ist gerade weg. Bitte neu wählen.'}; break; }
        const id = newId();
        APPTS.push({id, staffId:p.staffId, date:p.date, start:p.time, end:p.time + svc.duration, svcId:svc.id, name:p.name.trim(), phone:p.phone.trim(), source:'telefon', status:'ok'});
        t.newId = id; t.date = p.date; t.sheet = null;
        toast('Eingetragen · online nicht mehr buchbar');
        break; }
      case 't-ph-link': if (!waUrl(p.phone)) { p.errors = {phone:'Für den Link brauchst du die Handynummer.'}; break; } p.errors = {}; p.waReady = true; break;
      case 't-bl-reason': t.bl.reason = el.dataset.id; if (el.dataset.id === 'Urlaub' || el.dataset.id === 'Krank') t.bl.allDay = true; break;
      case 't-bl-save': {
        const b = t.bl, start = b.allDay ? toMin(DAY_OPEN) : toMin(b.from), end = b.allDay ? toMin(DAY_CLOSE) : toMin(b.to);
        if (end <= start) { toast('„Bis“ muss nach „Von“ liegen.'); return; }
        const clashes = APPTS.filter(x => x.staffId === b.staffId && x.date === b.date && x.status !== 'cancel' && start < x.end && end > x.start).length;
        BLOCKS.push({id:newId(), staffId:b.staffId, date:b.date, start, end, reason:b.reason});
        t.date = b.date; t.sheet = null;
        toast(clashes ? 'Geblockt · Achtung: ' + clashes + ' Termin(e) liegen in dieser Zeit' : 'Geblockt · online nicht mehr buchbar');
        break; }
      case 't-ap-noshow': { const x = APPTS.find(y => y.id === t.sel); x.status = x.status === 'noshow' ? 'ok' : 'noshow'; break; }
      case 't-ap-cancel': t.confirmCancel = true; break;
      case 't-ap-cancel-no': t.confirmCancel = false; break;
      case 't-ap-cancel-yes': { const x = APPTS.find(y => y.id === t.sel); x.status = 'cancel'; t.sheet = null; t.confirmCancel = false; toast('Abgesagt · Zeit ist online wieder frei'); break; }
      case 't-blk-del': { const i = BLOCKS.findIndex(y => y.id === t.sel); if (i > -1) BLOCKS.splice(i,1); t.sheet = null; toast('Block aufgehoben'); break; }
      default: return;
    }
    render();
  });

  function setField(path, value){ const [k, f] = path.split('.'); (k === 'c' ? S.c : S.t[k])[f] = value; }
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (el.dataset && el.dataset.f && el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'date') setField(el.dataset.f, el.value);
    if (el.dataset && el.dataset.f === 'ph.phone') { const link = overlay.querySelector('a[href^="https://wa.me/"]'); const u = waUrl(el.value); if (link && u) link.href = u; }
  });
  document.addEventListener('change', ev => {
    const el = ev.target; if (!el.dataset || !el.dataset.f) return;
    if (el.type === 'checkbox') setField(el.dataset.f, el.checked); else setField(el.dataset.f, el.value);
    if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'date') {
      if (el.dataset.f === 'ph.svcId') S.t.ph.time = null;
      if (el.dataset.f !== 'c.consent') renderSheet();
    }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.t.sheet) { S.t.sheet = null; renderSheet(); } });

  document.addEventListener('submit', ev => {
    if (ev.target.id === 'ph-unlock') { ev.preventDefault(); tryUnlock(document.getElementById('ph-code').value); return; }
    if (ev.target.id !== 'c-form') return;
    ev.preventDefault();
    const c = S.c, e = {};
    if (c.name.trim().length < 2) e.name = 'Bitte gib deinen Namen ein.';
    if (c.phone.replace(/\D/g,'').length < 7) e.phone = 'Bitte gib deine Handynummer ein.';
    if (!c.consent) e.consent = 'Bitte bestätige die Bedingungen.';
    c.errors = e;
    if (Object.keys(e).length) { render(); return; }
    if (!freeSlots(c.date, c.svc, c.staffId).some(s => s.t === c.time)) { c.step = 2; render(); return; }
    const id = newId();
    APPTS.push({id, staffId:c.staffId, date:c.date, start:c.time, end:c.time + c.svc.duration, svcId:c.svc.id, name:c.name.trim(), phone:c.phone.trim(), source:'online', status:'ok'});
    S.t.newId = id; S.t.date = c.date;
    c.step = 4; render();
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>
